<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Risk matrix — severity by likelihood, packages/studio</title>
  <rect width="760" height="460" fill="#0f1117"/>
  <text x="30" y="34" fill="#e6e8ee" font-size="17" font-weight="600">Risk matrix — the 8 high findings + the 3 that gate a release</text>
  <text x="30" y="54" fill="#8b90a0" font-size="12">Severity is from the database. Likelihood is the reviewer's judgement, stated as such — it is not a measured value.</text>

  <!-- grid -->
  <g stroke="#232733" stroke-width="1">
    <line x1="150" y1="90" x2="700" y2="90"/>
    <line x1="150" y1="180" x2="700" y2="180"/>
    <line x1="150" y1="270" x2="700" y2="270"/>
    <line x1="150" y1="360" x2="700" y2="360"/>
    <line x1="150" y1="90" x2="150" y2="360"/>
    <line x1="333" y1="90" x2="333" y2="360"/>
    <line x1="516" y1="90" x2="516" y2="360"/>
    <line x1="700" y1="90" x2="700" y2="360"/>
  </g>

  <!-- cell tints: top-right = worst -->
  <rect x="516" y="90"  width="184" height="90" fill="#7f1d1d" opacity="0.30"/>
  <rect x="333" y="90"  width="183" height="90" fill="#7f1d1d" opacity="0.18"/>
  <rect x="516" y="180" width="184" height="90" fill="#b45309" opacity="0.20"/>
  <rect x="333" y="180" width="183" height="90" fill="#b45309" opacity="0.12"/>

  <!-- axis labels -->
  <text x="425" y="392" fill="#8b90a0" font-size="12" text-anchor="middle">LIKELIHOOD  →</text>
  <text x="241" y="380" fill="#6b7080" font-size="11" text-anchor="middle">rare</text>
  <text x="424" y="380" fill="#6b7080" font-size="11" text-anchor="middle">plausible</text>
  <text x="608" y="380" fill="#6b7080" font-size="11" text-anchor="middle">certain / already true</text>
  <text x="30" y="140" fill="#e6e8ee" font-size="12" font-weight="600">HIGH</text>
  <text x="30" y="230" fill="#e6e8ee" font-size="12" font-weight="600">MEDIUM</text>
  <text x="30" y="320" fill="#e6e8ee" font-size="12" font-weight="600">LOW</text>

  <!-- HIGH / certain -->
  <text x="528" y="112" fill="#fca5a5" font-size="11.5">#46+#47 http.ts:13 + static-serve.ts:154</text>
  <text x="528" y="128" fill="#8b90a0" font-size="10.5">EACCES on one asset kills the dev server</text>
  <text x="528" y="146" fill="#fca5a5" font-size="11.5">#1 README:5 · #12 ROADMAP:89</text>
  <text x="528" y="162" fill="#8b90a0" font-size="10.5">already false today; blocks acceptance</text>

  <!-- HIGH / plausible -->
  <text x="345" y="112" fill="#fca5a5" font-size="11.5">#27 builder/index.tsx:257</text>
  <text x="345" y="128" fill="#8b90a0" font-size="10.5">needs a failed listing first, then permanent</text>
  <text x="345" y="146" fill="#fca5a5" font-size="11.5">#68 http.ts guard untested</text>
  <text x="345" y="162" fill="#8b90a0" font-size="10.5">the branch cannot be asserted today</text>

  <!-- HIGH / rare -->
  <text x="162" y="120" fill="#fca5a5" font-size="11.5">#16 CC=18 · #17 CC=16</text>
  <text x="162" y="136" fill="#8b90a0" font-size="10.5">maintainability, not a live defect</text>

  <!-- MEDIUM / certain -->
  <text x="528" y="204" fill="#fcd34d" font-size="11.5">#64 main.test.tsx:67</text>
  <text x="528" y="220" fill="#8b90a0" font-size="10.5">proven green with the logic inverted</text>
  <text x="528" y="238" fill="#fcd34d" font-size="11.5">svc/* returns 200 text/html</text>
  <text x="528" y="254" fill="#8b90a0" font-size="10.5">reproduced on both URL shapes</text>

  <!-- MEDIUM / plausible -->
  <text x="345" y="204" fill="#fcd34d" font-size="11.5">scenario "offline" inert</text>
  <text x="345" y="222" fill="#fcd34d" font-size="11.5">env leak in integration suite</text>
  <text x="345" y="240" fill="#fcd34d" font-size="11.5">agent-scan 500s on unreadable dir</text>

  <!-- LOW band note -->
  <text x="162" y="300" fill="#9ca3af" font-size="11.5">32 low findings — mostly maturity slips concentrated in one 509-line component</text>
  <text x="162" y="318" fill="#6b7080" font-size="10.5">Nits by FAANG convention: report, do not gate.</text>

  <!-- legend -->
  <text x="30" y="424" fill="#8b90a0" font-size="11">81 findings · 8 high · 24 medium · 32 low · 17 info (verified defenses) · 20 blocking</text>
  <text x="30" y="442" fill="#6b7080" font-size="10.5">Coverage: 39/48 files inspected (81%). Every production logic module was read; the 9 uninspected are config/manifest files.</text>
</svg>
