name: CI

# Until this file existed, the only workflow in this repository was the secret scan.
# A pull request here reported "all checks passed" on the strength of a credential
# sweep alone — which says nothing about whether the code compiles, let alone runs.
# `@theokit/studio` is published to npm from this tree; it was the one publishable
# package in the org with no build verification of any kind.
#
# BOTH promotion legs are pull requests — workspace -> develop and develop -> main —
# so both bases are listed. Naming only `main` would leave `develop`, the branch whose
# entire job is to integrate, accepting code CI never saw.
#
# `workspace` is deliberately absent from `push`: every promotion out of it is a pull
# request, so the pull_request trigger already covers that commit, and adding it here
# would run the same job twice on the same SHA.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Supersede in-flight runs, never on a protected branch: those runs are the record of
# what `main` and `develop` actually passed, and Release keys off main's state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# Nothing here writes. The default token is read-only so a compromised step in a build
# cannot push, tag or open anything.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (check, build, typecheck, test)
    runs-on: ubuntu-latest
    # The whole suite is seconds of work. A ceiling far under GitHub's 6-hour default
    # keeps a wedged runner from holding a slot all afternoon.
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever controls
      # the action repository can repoint `v7` at different code, and it would run here
      # with the permissions of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would let any later
          # step, or any tool reading the config, act as this repository.
          persist-credentials: false

      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      # Formatting and lint need nothing built, so they run first and fail in seconds
      # rather than after a build nobody needed.
      - name: Biome (lint + format)
        run: pnpm check

      # BUILD BEFORE TYPECHECK AND TEST. The package ships a Vite app and a tsup-built
      # plugin entry, and the plugin's types resolve through `dist/`. A stale `dist/` on
      # a developer machine hides that; on a fresh clone the later gates fail outright.
      - name: Build (vite app + tsup plugin)
        run: pnpm build

      - name: TypeScript (no emit)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # SonarQube Cloud, from CI rather than Automatic Analysis.
  #
  # Automatic Analysis does not import coverage — "code coverage information is not supported" in
  # its own documentation — so on that mechanism this project reported bugs and smells while the
  # quality gate stayed blind to how much of the code the suite reaches.
  #
  # The workflow lives in shared-workflows rather than as a step here. The one repository that
  # had an inline version carried `if: matrix.node-version == '22.x'` against a matrix of
  # ['22.12', '22'] — a value that never occurs — so the step reported `skipped` on every run for
  # two months, and a skipped step renders exactly like a passing one.
  #
  # Automatic Analysis must be OFF for this project or the scanner refuses to run:
  # "You are running CI analysis while Automatic Analysis is enabled." Already switched off.
  sonar:
    needs: verify
    # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
    # caller without eleven pull requests, which is the reason that repository exists.
    uses: usetheokit/shared-workflows/.github/workflows/sonar.yml@v1 # zizmor: ignore[unpinned-uses]
    # Named rather than inherited: `secrets: inherit` would hand the scanner every secret
    # this repository holds.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      coverage-command: pnpm test:coverage

  # The channel this repository declares and the state changesets is actually in must agree.
  # `changeset pre exit`, a bad merge, or a conflict resolved the wrong way removes
  # `.changeset/pre.json`; nothing errors; the next release publishes a stable version and moves
  # the `latest` dist-tag for every consumer, reporting success. This is the pull-request half of
  # the gate — `release.yml` carries the other half, for the path that never passed through here.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every caller
      # without seven pull requests, which is the reason that repository exists.
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]
