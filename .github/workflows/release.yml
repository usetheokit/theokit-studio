name: Release

# theokit-studio: `@theokit/studio`. Changesets-driven release.
#
# Until this file existed the repository had a `release` script and a `.changeset/`
# directory and no workflow to run either — the package was published, if at all, by
# hand. A publish from a laptop carries no provenance: a consumer cannot check that
# the tarball came from this source at this commit rather than from whoever held the
# credential.
#
# AUTHENTICATION IS OIDC, NOT A TOKEN. `@theokit/studio` carries a Trusted Publisher
# connection on npmjs.com naming this repository and THIS FILE. npm mints a
# short-lived credential scoped to that package; it cannot be exported or replayed.
# Renaming this file, or publishing from any other workflow, breaks the trust and the
# publish is rejected — that is the point of it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release via Changesets (theokit-studio)
    runs-on: ubuntu-latest
    # A ceiling well under GitHub's 6-hour default keeps a wedged job from holding a
    # runner, and this is the job it costs the most to leave open.
    timeout-minutes: 30
    permissions:
      # changesets opens and updates the version pull request, and pushes its tags.
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for permission to publish. Without it there is no
      # credential at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # The one checkout in this repository that keeps its credential, and not by
          # oversight: changesets/action pushes the version commit and the release tags
          # with the git CLI, which authenticates from exactly this persisted token.
          # `persist-credentials: false` breaks the release.
          #
          # changesets reads tags to decide what is unpublished; a shallow clone hides them.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` — `packageManager` in package.json is already the authority on
        # the pnpm version, and pinning it twice creates two places to update.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc, for the same single-authority reason.
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
          # NO `registry-url`. It looks harmless and is not: setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc
          # UNCONDITIONALLY and points NPM_CONFIG_USERCONFIG at it, then exports
          # NODE_AUTH_TOKEN only if the caller supplied one — which, under OIDC, nobody
          # does. The job would publish with a config declaring a credential that does not
          # exist. registry.npmjs.org is already the default, and `publishConfig.access:
          # public` in the manifest already covers the scope.

      # THE STEP WITHOUT WHICH THE OIDC CONFIGURATION IS CORRECT AND USELESS. setup-node
      # ships whatever npm the Node release bundles, and Node 22 bundles npm 10.9.7. OIDC
      # needs npm >= 11.5.1: an older npm does not know what to do with `id-token: write`,
      # looks for a credential, finds none, and the registry answers `E404 Not Found - PUT`.
      #
      # Pinned exactly, and NOT to 12.x. npm 12 breaks this release path in two places, and
      # the quiet one is the dangerous half:
      #   1. It rejects the `--no-git-checks` flag changesets passes through, with
      #      EUNKNOWNCONFIG, where every earlier npm ignored it.
      #   2. It returns an ARRAY from `npm info --json` where earlier npm returned an
      #      object. changesets reads `response.pkgInfo.versions || []`; on an array that
      #      is `undefined`, the list of published versions comes back empty, and every
      #      package looks unpublished. Nothing errors — it just tries to publish
      #      everything.
      # 11.9.0 is the newest npm that clears the OIDC floor and avoids both. Measured in
      # theokit-di; see that repository's release.yml for the numbers.
      - name: Install an npm that speaks OIDC (>= 11.5.1) but tolerates the publish flags
        run: npm install -g npm@11.9.0 # zizmor: ignore[adhoc-packages] — bootstrapping npm itself; no lockfile can cover it

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm install` runs the root `prepare` script, which points core.hooksPath at
      # `.githooks` — so a local pre-commit hook is armed on this runner. changesets then
      # runs `git commit -m "Version Packages"`, the hook fires, finds none of the binaries
      # it expects, and fails closed exactly as designed.
      #
      # The hook is right to fail closed and wrong to be armed here. It exists for the
      # commit a PERSON makes. This commit is made by a bot, from files it generated out of
      # content already in the repository, onto `changeset-release/main` — which reaches
      # `main` only through a pull request, where the repository's own gates run.
      #
      # `|| true` because --unset exits 5 when the key is absent, and an absent key is
      # already the state this step wants.
      - name: Disarm the local pre-commit hook for the bot's version commit
        run: git config --unset core.hooksPath || true

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          # The only credential here, and it is GitHub's own: changesets uses it to open
          # the version pull request. Nothing here authenticates to npm.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO PROVENANCE, AND NOT BY OVERSIGHT. npm refuses to attest a package whose
          # source repository is private, answering E422. This repository is private, so
          # declaring `publishConfig.provenance: true` would fail every publish rather than
          # produce an unsigned one.
          #
          # Trusted publishing still works — it is authentication, and it is what removes the
          # long-lived token. What is missing is the attestation a consumer could verify.
          # Restore `publishConfig.provenance: true` in packages/studio/package.json the day
          # this repository goes public; nothing else here has to change.
